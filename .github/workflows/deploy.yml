name: CI / CD Verification

on:
  push:
    branches: [ main, main-* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run ESLint
      run: npm run lint

    - name: Verify Build
      run: npm run build
      env:
        # Dummy DB URL for build context
        DATABASE_URL: "postgresql://dummy:password@localhost:5432/dummy"
        NEXTAUTH_SECRET: "dummy_ci_secret"
        NEXTAUTH_URL: "http://localhost:3000"
